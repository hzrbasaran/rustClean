name: Release

# Push a tag like v0.1.0 to build binaries, publish a GitHub release, update
# the Homebrew formula and publish the crate to crates.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="rustclean-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rustclean.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/rustclean" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the matching section of CHANGELOG.md.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "rustClean $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # Publishes the crate to crates.io once every binary has built. Needs the
  # CARGO_REGISTRY_TOKEN secret: a crates.io API token with only the
  # "publish-update" scope, limited to the rustclean crate. A published
  # version can never be deleted (only yanked), hence the checks first.
  crates-io:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "rustclean") | .version')
          if [ "$crate_version" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $crate_version."
            exit 1
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; the crate was not published."
            exit 0
          fi
          # A re-run after a successful publish has nothing to do.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "rustclean release workflow (github.com/hzrbasaran/rustClean)" \
            "https://crates.io/api/v1/crates/rustclean/$version")
          if [ "$status" = "200" ]; then
            echo "rustclean $version is already on crates.io."
            exit 0
          fi
          cargo publish --locked

  # Points the Homebrew formula (hzrbasaran/homebrew-tap) at the new release.
  # Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with
  # "Contents: read and write" on the tap repository only.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew formula was not updated."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/hzrbasaran/homebrew-tap.git" tap
          scripts/homebrew-formula.sh "$version" SHA256SUMS.txt > tap/Formula/rustclean.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rustclean.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git commit -m "rustclean ${version}"
          git push
