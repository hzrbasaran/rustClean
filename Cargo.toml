[package]
name = "rustclean"
version = "0.5.0"
edition = "2021"
description = "Fast terminal disk usage analyzer and cleaner: reports, duplicates, app leftovers, developer caches, treemap"
authors = ["hzrbasaran <hzrbasaran@hotmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hzrbasaran/rustClean"
homepage = "https://github.com/hzrbasaran/rustClean"
readme = "README.md"
keywords = ["disk-usage", "cleaner", "tui", "duplicates", "treemap"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["docs/screenshots/*", ".github/*", "src/integration/snapshots/*"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.5.61", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"], optional = true }
image_hasher = { version = "3.1.1", optional = true }
plist = "1.10.1"
ratatui = "0.30.2"
rayon = "1.12.0"
serde_json = "1.0.151"
sysinfo = "0.39.6"
toml = { version = "1.1.6", default-features = false, features = ["parse", "std", "serde"] }
trash = "5.2.9"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[features]
default = ["similar-images"]
# The "Similar images" report: decodes images to compare them (about 1.2 MB).
similar-images = ["dep:image", "dep:image_hasher"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true

# Lint policy: see CONTRIBUTING.md. CI runs clippy with -D warnings, so every
# warning below fails the build.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
trivial_casts = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
doc_markdown = "warn"
items_after_statements = "warn"
