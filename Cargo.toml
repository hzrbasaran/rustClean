[package]
name = "rustclean"
version = "0.1.0"
edition = "2021"
description = "Fast terminal disk usage analyzer and cleaner: reports, duplicates, app leftovers, developer caches, treemap"
authors = ["hzrbasaran <hzrbasaran@hotmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hzrbasaran/rustClean"
homepage = "https://github.com/hzrbasaran/rustClean"
readme = "README.md"
keywords = ["disk-usage", "cleaner", "tui", "duplicates", "treemap"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["docs/screenshots/*", ".github/*"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.5.61", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1.1.10"
plist = "1.10.1"
ratatui = "0.29.0"
rayon = "1.12.0"
serde_json = "1.0.151"
sysinfo = "0.36.1"
trash = "5.2.9"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
