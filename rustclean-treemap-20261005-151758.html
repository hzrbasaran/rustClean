        r = { x: r.x, y: r.y + rh, w: r.w, h: r.h - rh };
      }
      start = end;
    }
    // Whole pixels; neighbors share their edges.
    return out.map(function (q) {
      var x0 = Math.round(q.x), y0 = Math.round(q.y);
      return { x: x0, y: y0, w: Math.round(q.x + q.w) - x0, h: Math.round(q.y + q.h) - y0 };
    });
  }

  // Lays out the children of `node` inside `box` (w × h); `nested` blocks
  // are one level down and get no further level.
  function draw(node, box, w, h, nested) {
    var kids = (node.k || []).map(function (c, i) { return { n: c, i: i }; });
    kids.sort(function (a, b) { return b.n.s - a.n.s; });
    var rects = squarify(kids.map(function (c) { return c.n.s; }), w, h);
    var whole = node.s;
    rects.forEach(function (r, j) {
      if (r.w < 1 || r.h < 1) return;
      var c = kids[j].n, bg = color(c, kids[j].i);
      var b = el("div", "b");
      b.style.left = r.x + "px"; b.style.top = r.y + "px";
      b.style.width = r.w + "px"; b.style.height = r.h + "px";
      b.style.background = bg; b.style.color = ink(bg);
      b._node = c; b._parent = node;
      if (c.t === "d" && c.k) b.classList.add("zoom");
      if (c.x) b.classList.add("cut");
      b.title = label(c) + "\n" + fmtSize(c.s) + " · " + fmtPct(c.s, whole);
      var small = nested ? 12 : 15;
      if (r.w >= 28 && r.h >= small) {
        var l = el("div", "l");
        l.appendChild(el("b", null, label(c)));
        b.appendChild(l);
        if (r.h >= small * 2 + 4) b.appendChild(el("div", "l", fmtSize(c.s) + " · " + fmtPct(c.s, whole)));
      }
      var head = 36; // two label lines
      if (!nested && c.k && r.w >= 60 && r.h >= 70) {
        var inner = el("div", "in");
        inner.style.top = head + "px";
        b.appendChild(inner);
        draw(c, inner, r.w - 8, r.h - head - 5, true);
      }
      box.appendChild(b);
    });
  }

  function current() { return stack[stack.length - 1]; }

  function render() {
    var node = current(), map = $("map");
    var top = map.getBoundingClientRect().top + window.scrollY;
    var h = Math.max(320, Math.min(window.innerHeight - 24, window.innerHeight - top - 110));
    map.style.height = h + "px";
    map.textContent = "";
    if (!node.k || !node.k.length) {
      map.appendChild(el("div", null, T.empty)).id = "empty";
    } else {
      draw(node, map, map.clientWidth, map.clientHeight, false);
    }
    $("up").disabled = stack.length < 2;
    var crumbs = $("crumbs");
    crumbs.textContent = "";
    stack.forEach(function (n, i) {
      if (i > 0) crumbs.appendChild(el("span", "sep", "›"));
      if (i === stack.length - 1) {
        crumbs.appendChild(el("span", "now", n.n));
      } else {
        var b = el("button", null, n.n);
        b.type = "button";
        b.onclick = function () { stack.length = i + 1; picked = null; render(); };
        crumbs.appendChild(b);
      }
    });
    $("total").textContent = fmtSize(node.s) + " · " + T.size;
    $("byType").setAttribute("aria-pressed", mode === "kind");
    $("byAge").setAttribute("aria-pressed", mode === "age");
    legend();
    show(picked);
  }

  function legend() {
    var box = $("legend");
    box.textContent = "";
    function item(c, text) {
      var s = el("span"), i = el("i");
      i.style.background = c;
      s.appendChild(i);
      s.appendChild(document.createTextNode(text));
      box.appendChild(s);
    }
    if (mode === "kind") {
      var f = el("span"), k;
      for (k = 0; k < 4; k++) { var i = el("i"); i.style.background = DIRS[k]; i.style.marginRight = "1px"; f.appendChild(i); }
      f.appendChild(document.createTextNode(" " + T.folders));
      box.appendChild(f);
      P.cats.forEach(function (name, j) { item(CATS[j], name); });
    } else {
      P.ages.forEach(function (name, j) { item(AGES[j], name); });
    }
    item(OTHER, T.other);
  }

  // The info line for a block (or the current folder).
  function show(pick) {
    var info = $("info"), node = pick ? pick.node : current();
    info.textContent = "";
    info.appendChild(el("b", null, label(node)));
    var parts = [fmtSize(node.s)];
    if (pick) parts.push(T.here.replace("{p}", fmtPct(node.s, pick.parent.s)));
    parts.push(T.whole.replace("{p}", fmtPct(node.s, P.root.s)));
    var kind = node.t === "d" ? T.folder : node.t === "o" ? T.other : P.cats[node.c];
    if (node.t !== "o") kind += " · " + P.ages[node.a];
    parts.push(kind);
    info.appendChild(document.createTextNode("  " + parts.join(" · ")));
    var note = node.x ? T.cut : pick && node.t === "d" && node.k ? T.zoom : "";
    if (note) info.appendChild(el("div", "muted", note));
  }

  function zoom(path) {
    path.forEach(function (n) { stack.push(n); });
    picked = null;
    render();
  }

  var map = $("map");
  map.addEventListener("click", function (e) {
    var b = e.target.closest(".b");
    if (!b) return;
    var outer = b.parentNode.closest ? b.parentNode.closest(".b") : null;
    var n = b._node;
    if (n.t === "d" && n.k) {
      zoom(outer ? [outer._node, n] : [n]);
    } else if (outer) {
      // A file inside a folder block: open that folder.
      zoom([outer._node]);
    } else {
      picked = { node: n, parent: b._parent };
      show(picked);
    }
  });
  map.addEventListener("mouseover", function (e) {
    var b = e.target.closest(".b");
    if (b) show({ node: b._node, parent: b._parent });
  });
  map.addEventListener("mouseleave", function () { show(picked); });
  function up() {
    if (stack.length > 1) { stack.pop(); picked = null; render(); }
  }
  $("up").onclick = up;
  $("byType").onclick = function () { mode = "kind"; render(); };
  $("byAge").onclick = function () { mode = "age"; render(); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); up(); }
  });
  var pending = false;
  window.addEventListener("resize", function () {
    if (pending) return;
    pending = true;
    window.requestAnimationFrame(function () { pending = false; render(); });
  });

  $("title").textContent = T.title;
  $("path").textContent = P.path;
  $("up").textContent = T.up;
  $("colorLabel").textContent = T.color;
  $("byType").textContent = T.byType;
  $("byAge").textContent = T.byAge;
  $("hint").textContent = T.hint;
  $("limits").textContent = T.limits;
  $("offline").textContent = T.offline;
  $("made").textContent = T.made;
  render();
})();
</script>
</body>
</html>
