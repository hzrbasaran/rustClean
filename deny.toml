# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check` (install with `cargo install cargo-deny`).

[graph]
# The targets the release workflow builds.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Known vulnerabilities and unmaintained crates from the RustSec database.
version = 2
yanked = "deny"

[licenses]
version = 2
# Compatible with distributing rustclean under MIT OR Apache-2.0. Only
# licenses that a dependency actually uses are listed; add one with a note
# in the pull request that brings the dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    # option-ext (via dirs): weak, file-level copyleft. Using the crate
    # unmodified places no obligations on rustclean's own code.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate only cost build time; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
